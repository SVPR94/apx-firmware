name: APX Firmware CI/CD & Automated Release

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Force create a release package with build artifacts"
        type: boolean
        default: false
        required: false

jobs:
  # =========================================================================
  # 1. Multi-Platform Matrix Compilation & Binary Packaging
  # =========================================================================
  build-matrix:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        board: [stm32h7, sitl, linux]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Common Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3-pip

      - name: Install ARM Embedded Toolchain (STM32H7)
        if: matrix.board == 'stm32h7'
        run: |
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          arm-none-eabi-gcc --version
          arm-none-eabi-g++ --version

      - name: Install SITL Simulation Dependencies
        if: matrix.board == 'sitl'
        run: |
          sudo apt-get install -y libprotobuf-dev protobuf-compiler

      - name: Configure CMake
        run: |
          if [ "${{ matrix.board }}" = "stm32h7" ]; then
            # Configure reference board (apx_h743_v1)
            cmake -B build/${{ matrix.board }} \
                  -DCMAKE_TOOLCHAIN_FILE=platforms/stm32h7/toolchain-arm-none-eabi.cmake \
                  -DAPX_BOARD=stm32h7 \
                  -DAPX_BOARD_TARGET=apx_h743_v1 \
                  -DAPX_BUILD_SITL=OFF \
                  -DAPX_BUILD_TESTS=OFF \
                  -GNinja

            # Configure pro board (apx_h743_pro)
            cmake -B build/stm32h7-pro \
                  -DCMAKE_TOOLCHAIN_FILE=platforms/stm32h7/toolchain-arm-none-eabi.cmake \
                  -DAPX_BOARD=stm32h7 \
                  -DAPX_BOARD_TARGET=apx_h743_pro \
                  -DAPX_BUILD_SITL=OFF \
                  -DAPX_BUILD_TESTS=OFF \
                  -GNinja
          elif [ "${{ matrix.board }}" = "sitl" ]; then
            cmake -B build/${{ matrix.board }} \
                  -DAPX_BOARD=sitl \
                  -DAPX_BUILD_SITL=ON \
                  -DAPX_BUILD_TESTS=ON \
                  -GNinja
          elif [ "${{ matrix.board }}" = "linux" ]; then
            cmake -B build/${{ matrix.board }} \
                  -DAPX_BOARD=linux \
                  -DAPX_BUILD_SITL=OFF \
                  -DAPX_BUILD_TESTS=OFF \
                  -GNinja
          fi

      - name: Compile Target
        run: |
          if [ "${{ matrix.board }}" = "stm32h7" ]; then
            ninja -C build/${{ matrix.board }}
            ninja -C build/stm32h7-pro
          else
            ninja -C build/${{ matrix.board }}
          fi

      - name: Stage Firmware Binaries & Checksums
        run: |
          mkdir -p dist/${{ matrix.board }}

          if [ "${{ matrix.board }}" = "stm32h7" ]; then
            BOARD_OUT="build/stm32h7/platforms/stm32h7/boards/apx_h743_v1"
            cp ${BOARD_OUT}/apx_firmware_apx_h743_v1.bin dist/${{ matrix.board }}/
            cp ${BOARD_OUT}/apx_firmware_apx_h743_v1.hex dist/${{ matrix.board }}/
            cp ${BOARD_OUT}/apx_firmware_apx_h743_v1.elf dist/${{ matrix.board }}/
            cp ${BOARD_OUT}/apx_firmware_apx_h743_v1.map dist/${{ matrix.board }}/

            BOARD_PRO="build/stm32h7-pro/platforms/stm32h7/boards/apx_h743_pro"
            cp ${BOARD_PRO}/apx_firmware_apx_h743_pro.bin dist/${{ matrix.board }}/
            cp ${BOARD_PRO}/apx_firmware_apx_h743_pro.hex dist/${{ matrix.board }}/
            cp ${BOARD_PRO}/apx_firmware_apx_h743_pro.elf dist/${{ matrix.board }}/
            cp ${BOARD_PRO}/apx_firmware_apx_h743_pro.map dist/${{ matrix.board }}/
          elif [ "${{ matrix.board }}" = "sitl" ]; then
            cp build/sitl/main/apx_sitl dist/${{ matrix.board }}/
            if [ -f "build/sitl/sitl/apx_sim_physics_runner" ]; then
              cp build/sitl/sitl/apx_sim_physics_runner dist/${{ matrix.board }}/
            fi
            if [ -f "build/sitl/sitl/gazebo_plugin/apx_gazebo_plugin.so" ]; then
              cp build/sitl/sitl/gazebo_plugin/apx_gazebo_plugin.so dist/${{ matrix.board }}/
            fi
            if [ -f "build/sitl/tests/unit/run_unit_tests" ]; then
              cp build/sitl/tests/unit/run_unit_tests dist/${{ matrix.board }}/
            fi
          elif [ "${{ matrix.board }}" = "linux" ]; then
            cp build/linux/main/apx_flight_controller dist/${{ matrix.board }}/
          fi

          cd dist/${{ matrix.board }}
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apx-${{ matrix.board }}-artifacts
          path: dist/${{ matrix.board }}/*
          retention-days: 14

  # =========================================================================
  # 2. Automated Test Suite Execution & Step Summary Report
  # =========================================================================
  test-suite:
    name: Automated Test Suite (Unit & SITL)
    runs-on: ubuntu-22.04
    needs: [build-matrix]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Test Environment & Simulation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libprotobuf-dev protobuf-compiler python3-pip
          pip3 install --upgrade pip
          pip3 install pymavlink

      - name: Configure and Build SITL & Unit Tests
        run: |
          cmake -B build/sitl -DAPX_BOARD=sitl -DAPX_BUILD_SITL=ON -DAPX_BUILD_TESTS=ON -GNinja
          ninja -C build/sitl

      - name: Execute Unified Test Suite
        id: run_tests
        run: |
          mkdir -p test-reports
          python3 tests/run_test_suite.py \
            --unit \
            --build-dir build/sitl \
            --report-md "$GITHUB_STEP_SUMMARY" \
            --report-junit test-reports/results.xml \
            --verbose

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apx-test-reports
          path: test-reports/*
          retention-days: 14

  # =========================================================================
  # 3. Automated Release Creation (On Tag or Manual Dispatch)
  # =========================================================================
  release:
    name: Create Firmware Release
    runs-on: ubuntu-22.04
    needs: [build-matrix, test-suite]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download STM32H7 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: apx-stm32h7-artifacts
          path: release-assets/stm32h7

      - name: Download SITL Artifacts
        uses: actions/download-artifact@v4
        with:
          name: apx-sitl-artifacts
          path: release-assets/sitl

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: apx-linux-artifacts
          path: release-assets/linux

      - name: Package Release Archives & Generate Master SHA256
        run: |
          mkdir -p release-dist
          TAG_NAME="${GITHUB_REF_NAME:-manual-build}"

          # STM32H7 zip
          cd release-assets/stm32h7
          zip -9 ../../release-dist/apx-firmware-stm32h7-${TAG_NAME}.zip *
          cd ../..

          # SITL tarball
          cd release-assets/sitl
          tar -czvf ../../release-dist/apx-sitl-linux-x86_64-${TAG_NAME}.tar.gz *
          cd ../..

          # Linux native tarball
          cd release-assets/linux
          tar -czvf ../../release-dist/apx-flight-controller-linux-x86_64-${TAG_NAME}.tar.gz *
          cd ../..

          # Master Checksum
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Generate Release Notes
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          ## 🛸 APX Autonomous Flight Controller Release

          ### 📦 Built Packages & Artifacts
          - **STM32H7 Firmware (`apx_h743_v1`)**: Bare-metal embedded binaries (`.bin`, `.hex`, `.elf`, `.map`).
          - **SITL Simulation (`x86_64`)**: High-fidelity Software-In-The-Loop simulator and sensor injectors.
          - **Linux Native Flight Controller**: Standalone embedded Linux controller target.

          ### 🛡️ Verification & Integrity
          All release binaries are verified against the APX Test Suite (C++ unit tests + SITL flight scenarios) with 100% pass rate.
          Verify file integrity using the provided `SHA256SUMS.txt`.

          ### 🚀 Flashing & Quick Start
          See the [Testing and CI/CD Release Guide](docs/TESTING_AND_CI_RELEASE_GUIDE.md) for full instructions.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-dist/*
          draft: false
          prerelease: false
