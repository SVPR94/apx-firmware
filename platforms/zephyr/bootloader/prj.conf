# APX bootloader - Zephyr configuration common to every board.
# USB CDC settings for USB boards live in boards/<board>.conf.

CONFIG_CPP=y
CONFIG_STD_CPP17=y
# Full C++ library (the shared HAL serial interface uses <functional>);
# newlib-nano keeps the image small.
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Flash is read back right after programming (CRC): keep the data cache off
# so reads always see flash, not stale cache lines.
CONFIG_DCACHE=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_SIZE_OPTIMIZATIONS=y

# Link into the bootloader partition (app.overlay picks it).
CONFIG_USE_DT_CODE_PARTITION=y
