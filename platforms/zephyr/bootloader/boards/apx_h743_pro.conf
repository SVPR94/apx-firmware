# Bootloader link: USB CDC-ACM (the board's apx,gcs-uart).
# Ground stations that detect bootloaders by USB VID/PID may need the
# board's own IDs here (CONFIG_CDC_ACM_SERIAL_VID / _PID).
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="APX"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="APX Bootloader (H743 Pro)"
