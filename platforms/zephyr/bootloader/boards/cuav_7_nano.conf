# CUAV 7-Nano: bootloader link over USB CDC-ACM. Generated by tools/import_board.py from the board's hardware description; re-run it rather than editing.
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="APX"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="APX Bootloader (CUAV 7-Nano)"
