# APX hardware firmware - Zephyr configuration (bring-up milestone 1).

# C++17 with the full standard library (newlib, from the Arm GNU toolchain)
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y

# Hard-float FPU, shared between threads
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_MAIN_STACK_SIZE=16384

# Microsecond time for the control loop (64-bit SysTick cycle counter)
CONFIG_CORTEX_M_SYSTICK_64BIT_CYCLE_COUNTER=y

# MAVLink over USB CDC-ACM (device stack "next")
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="APX"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="APX Cube Orange+"

CONFIG_RING_BUFFER=y

# No debug console on this board: the USB port carries MAVLink.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
